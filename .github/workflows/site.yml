name: website

# The website, site/, uploaded to Azure Static Web Apps on every push to main that changes it.
# Nothing is built here: site/results.json is written by `smallprint site` on the machine that
# holds the runs (they are not in the repository) and committed with the page, and CI's
# tests/test_site.py checks it against the break-even it prints. The same deploy path as
# peterparker.ca: the upload token is the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN,
# never a file in the repository.
#
# Off until the site exists: docs/deploy.md step 3 adds the secret and sets the repository
# variable SITE = on. Until then every run skips rather than failing.

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.SITE == 'on' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
