<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="972" viewBox="0 0 1180 972" role="img" aria-label="Filings are fetched under the SEC&#x27;s fair-access rules, their primary statements located, one XBRL fact chosen per field from the filing being labelled, kept only when the printed figure is on the page at its own precision, audited by hand, split by company with a post-cutoff test set, and published with a datasheet." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
