<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="972" viewBox="0 0 1180 972" role="img" aria-label="Each base is fine-tuned with QLoRA on a rented GPU with checkpoints against spot interruptions, merged to bf16, quantised to each format and gated against its own bf16, served with vLLM or llama.cpp from a container, load-tested at four concurrencies, and registered with the gateway so its cost per call comes from the same ledger as the frontier APIs." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
