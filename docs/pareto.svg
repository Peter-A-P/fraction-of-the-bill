<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" class="c" role="img" aria-labelledby="title desc">
<title id="title">Field accuracy against cost per 1,000 extractions</title>
<desc id="desc">Self-hosted cost is the GPU-hour rate over the throughput measured at 32 requests in flight, at 50% utilisation; break-even is against `openai/gpt-5.6-luna zero_shot` at US$0.87 per 1,000, the cheapest frontier run, from the gateway ledger.</desc>
<style>
.c { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.surface { fill: #fcfcfb; }
.grid { stroke: #e1e0d9; stroke-width: 1; }
.axis { stroke: #c3c2b7; stroke-width: 1; }
.ink { fill: #0b0b0b; }
.ink2 { fill: #52514e; }
.muted { fill: #898781; font-variant-numeric: tabular-nums; }
.s1 { fill: #2a78d6; } .s1l { stroke: #2a78d6; }
.s2 { fill: #eb6834; } .s2l { stroke: #eb6834; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
.front { fill: none; stroke: #52514e; stroke-width: 1; stroke-dasharray: 3 3; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .ink { fill: #ffffff; }
  .ink2 { fill: #c3c2b7; }
  .s1 { fill: #3987e5; } .s1l { stroke: #3987e5; }
  .s2 { fill: #d95926; } .s2l { stroke: #d95926; }
  .ring { stroke: #1a1a19; }
  .front { stroke: #c3c2b7; }
}
</style>
