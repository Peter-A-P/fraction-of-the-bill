<line class="grid" x1="238.0" y1="56" x2="238.0" y2="396"/>
<text class="muted" x="238.0" y="414" font-size="12" text-anchor="middle">US$0.1</text>
<line class="grid" x1="404.0" y1="56" x2="404.0" y2="396"/>
<text class="muted" x="404.0" y="414" font-size="12" text-anchor="middle">US$1</text>
<line class="grid" x1="570.0" y1="56" x2="570.0" y2="396"/>
<text class="muted" x="570.0" y="414" font-size="12" text-anchor="middle">US$10</text>
<line class="grid" x1="736.0" y1="56" x2="736.0" y2="396"/>
<text class="muted" x="736.0" y="414" font-size="12" text-anchor="middle">US$100</text>
<line class="grid" x1="72" y1="396.0" x2="736" y2="396.0"/>
<text class="muted" x="64" y="400.0" font-size="12" text-anchor="end">95%</text>
<line class="grid" x1="72" y1="282.7" x2="736" y2="282.7"/>
<text class="muted" x="64" y="286.7" font-size="12" text-anchor="end">96%</text>
<line class="grid" x1="72" y1="169.3" x2="736" y2="169.3"/>
<text class="muted" x="64" y="173.3" font-size="12" text-anchor="end">97%</text>
